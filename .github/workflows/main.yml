name: Continuous Integration and Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout del codice (necessario per avere il Dockerfile)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Login a GitHub Container Registry (GHCR)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Estrazione intelligente dei Tag Docker
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,event=branch,branch=main
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 4. Build, Test (implicito) e Push dell'immagine Docker
      # Questo step ora fa tutto: la build di Docker eseguirà i test come definito
      # nel Dockerfile. Se i test falliscono, questo step fallirà.
      - name: Build, test, and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 5. Creazione della GitHub Release (SOLO per i tag)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
