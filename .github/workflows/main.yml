name: Continuous Integration and Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-test-and-publish:
    runs-on: ubuntu-lates
          
    steps:
      # 1. Checkout del codice 
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup del JDK 
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' 
          distribution: 'temurin'
          cache: 'maven'

      # 3. Esecuzione dei test
      - name: Run tests with Maven
        working-directory: ./energycommunities 
        run: ./mvnw test

      # 4. Login a GHCR
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Estrazione dei Tag Docker 
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,event=branch,branch=main
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 6. Build e Push dell'immagine Docker
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ./energycommunities
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 7. Creazione della Release 
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
