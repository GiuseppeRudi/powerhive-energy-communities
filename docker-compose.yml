services:
  postgres:
    container_name: postgress
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: energycommunities
    ports:
      - "5555:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  springboot-app:
    restart: always
    container_name: springboot-app
    build:
      context: ./energycommunities
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/energycommunities
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: create

  angular-app:
    container_name: angular-app
    build:
      context: ./energycommunities-ng
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      - springboot-app
    volumes:
      - ./energycommunities-ng:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  postgres-data: