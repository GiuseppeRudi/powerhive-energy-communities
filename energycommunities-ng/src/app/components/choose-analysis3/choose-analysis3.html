<div class="chart-section">
  <h2 class="section-title">Members Chosen</h2>

  <!-- Loader -->
  <div *ngIf="isLoading" class="loading-container">
    <app-generation-loader></app-generation-loader>
  </div>

  <!-- Lista membri -->
  <div *ngFor="let member of members" class="member-card">
    <div class="member-header">
      <!-- Info membro -->
      <div class="member-info">
        <h3 class="member-name" (click)="toggleMember(member.id)">
          {{ member.fullName }}
        </h3>
        <span
          class="member-badge"
          [class]="getMemberTypeLabel(member).toLowerCase()"
        >
          {{ getMemberTypeLabel(member) }}
        </span>
      </div>

      <!-- Azioni -->
      <div class="member-actions">
        <!-- Community Default -->
        <label class="action-checkbox">
          <input
            type="checkbox"
            [disabled]="wantToAdd.includes(member.id)"
            [checked]="communityMembers.includes(member.id)"
            (change)="onMemberStatusChange(member, 'default')"
          />
          <span>Community Default</span>
        </label>

        <!-- Want to Add -->
        <label class="action-checkbox">
          <input
            type="checkbox"
            [disabled]="communityMembers.includes(member.id)"
            [checked]="wantToAdd.includes(member.id)"
            (change)="onMemberStatusChange(member, 'add')"
          />
          <span>Want to Add</span>
        </label>

        <!-- Want to Remove -->
        <label class="action-checkbox">
          <input
            type="checkbox"
            [disabled]="!communityMembers.includes(member.id)"
            [checked]="wantToRemove.includes(member.id)"
            (change)="onMemberStatusChange(member, 'remove')"
          />
          <span>Want to Remove</span>
        </label>
      </div>

      <!-- Icona espansione -->
      <div
        class="expand-icon"
        [class.expanded]="isMemberExpanded(member.id)"
        (click)="toggleMember(member.id)"
      >
        <i class="fa-solid fa-square-caret-down"></i>
      </div>
    </div>

    <!-- Contenuto toggle -->
    <div
      class="member-content"
      [class.expanded]="isMemberExpanded(member.id)"
    >
      <div *ngIf="chartDataMap.get(member.id); else noData">
        <h4>Production / Consumption Graph</h4>
        <app-energy-chart
          [data]="chartDataMap.get(member.id)!"
          [options]="chartOptionsLine"
          [selectedChartType]="'line'"
        >
        </app-energy-chart>
      </div>

      <ng-template #noData>
        <div class="no-data">
          <p>No energy profiles available for this member.</p>
        </div>
      </ng-template>
    </div>
  </div>

  <div class="action-buttons">
    <button class="start-button" (click)="startAnalysis3()">Start</button>
  </div>


</div>
