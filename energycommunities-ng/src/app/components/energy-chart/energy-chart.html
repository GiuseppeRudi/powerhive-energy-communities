<div class="chart-container">
  <div class="chart-buttons">
    <button (click)="zoomIn()">+</button>
    <button (click)="zoomOut()">-</button>
    <button (click)="resetZoom()">Reset Zoom</button>
  </div>
  <canvas baseChart
          [data]="data"
          [options]="options"
          [type]="selectedChartType"
          >
  </canvas>
</div>
