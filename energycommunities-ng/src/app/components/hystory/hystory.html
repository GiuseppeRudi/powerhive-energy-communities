<div class="content-div">
  <div class="header-with-button">
    <h1>Cronologia Analisi</h1>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="loading-container">
    <p>Caricamento in corso...</p>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="error-container">
    <p>{{ error }}</p>
    <button class="btn" (click)="loadHistory()">Riprova</button>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && !error && historyList.length === 0" class="empty-state">
    <p>Non ci sono analisi salvate.</p>
  </div>

  <!-- History List -->
  <div *ngIf="!loading && !error && historyList.length > 0" class="history-container">
    <div *ngFor="let history of historyList" class="history-card">
      <!-- Header della card -->
      <div class="history-header">
        <div class="history-info">
          <h3>{{ history.analysisName || 'Analisi #' + history.analysisNumber }}</h3>
          <p class="history-date">{{ formatDate(history.createdAt) }}</p>
        </div>
        <!-- Bottone per visualizzare l'analisi -->
        <button class="btn-view" (click)="viewAnalysis(history.id)">Visualizza</button>
      </div>
    </div>
  </div>
</div>
