<div class="login-container">
  <div class="login-card">
    <button (click)="showRegister = !showRegister" class="btn">
      {{ showRegister ? 'Go back to login' : 'Register' }}
    </button>

    <div *ngIf="!showRegister">
      <h2>Login</h2>
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input
            type="text"
            id="login-username"
            name="username"
            [(ngModel)]="username"
            required
            [class.error]="loginError"
            (input)="loginError = false; errorMessage = null"
          />
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            name="password"
            [(ngModel)]="password"
            required
            [class.error]="loginError"
            (input)="loginError = false; errorMessage = null"
          />
        </div>
        <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
        <button type="submit" [disabled]="!loginForm.valid">Login</button>
      </form>
    </div>

    <!-- REGISTRAZIONE -->
    <div *ngIf="showRegister">
      <h2>Registration</h2>
      <form (ngSubmit)="onRegister()" #registerForm="ngForm">
        <div class="form-group">
          <label for="reg-username">Username</label>
          <input
            type="text"
            id="reg-username"
            name="username"
            [(ngModel)]="regUsername"
            required
            [class.error]="registerError"
            (input)="registerError = false; registerErrorMessage = null"
          />
        </div>

        <div class="form-group">
          <label for="reg-email">Email</label>
          <input
            type="email"
            id="reg-email"
            name="email"
            [(ngModel)]="regEmail"
            required
            [class.error]="registerError"
            (input)="registerError = false; registerErrorMessage = null"
          />
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <input
            type="password"
            id="reg-password"
            name="password"
            [(ngModel)]="regPassword"
            required
            [class.error]="registerError"
            (input)="registerError = false; registerErrorMessage = null"
          />
        </div>

        <div class="form-group">
          <label for="reg-firstname">First Name</label>
          <input
            type="text"
            id="reg-firstname"
            name="firstName"
            [(ngModel)]="regFirstName"
            required
            [class.error]="registerError"
            (input)="registerError = false; registerErrorMessage = null"
          />
        </div>

        <div class="form-group">
          <label for="reg-lastname">Last name</label>
          <input
            type="text"
            id="reg-lastname"
            name="lastName"
            [(ngModel)]="regLastName"
            required
            [class.error]="registerError"
            (input)="registerError = false; registerErrorMessage = null"
          />
        </div>

        <p *ngIf="registerErrorMessage" class="error-message">{{ registerErrorMessage }}</p>
        <button type="submit" [disabled]="!registerForm.valid">Register</button>
      </form>
    </div>
  </div>
</div>
