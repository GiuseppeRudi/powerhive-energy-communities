<div class="login-container">
  <!-- Pulsante per cambiare sezione -->
  <button (click)="showRegister = !showRegister">
    {{ showRegister ? 'Torna al login' : 'Registrati' }}
  </button>

  <!-- LOGIN -->
  <div *ngIf="!showRegister">
    <h2>Login</h2>
    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label for="login-username">Nome utente</label>
        <input
          type="text"
          id="login-username"
          name="username"
          [(ngModel)]="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input
          type="password"
          id="login-password"
          name="password"
          [(ngModel)]="password"
          required
        />
      </div>

      <button type="submit" [disabled]="!loginForm.valid">Accedi</button>
    </form>
  </div>

  <!-- REGISTRAZIONE -->
  <div *ngIf="showRegister">
    <h2>Registrazione</h2>
    <form (ngSubmit)="onRegister()" #registerForm="ngForm">
      <div class="form-group">
        <label for="reg-username">Username</label>
        <input
          type="text"
          id="reg-username"
          name="username"
          [(ngModel)]="regUsername"
          required
        />
      </div>

      <div class="form-group">
        <label for="reg-email">Email</label>
        <input
          type="email"
          id="reg-email"
          name="email"
          [(ngModel)]="regEmail"
          required
        />
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <input
          type="password"
          id="reg-password"
          name="password"
          [(ngModel)]="regPassword"
          required
        />
      </div>

      <div class="form-group">
        <label for="reg-firstname">Nome</label>
        <input
          type="text"
          id="reg-firstname"
          name="firstName"
          [(ngModel)]="regFirstName"
          required
        />
      </div>

      <div class="form-group">
        <label for="reg-lastname">Cognome</label>
        <input
          type="text"
          id="reg-lastname"
          name="lastName"
          [(ngModel)]="regLastName"
          required
        />
      </div>

      <button type="submit" [disabled]="!registerForm.valid">Registrati</button>
    </form>
  </div>
</div>
