<div class="content-div">

  <hr>

  <div class="form-container">

    <h3>Add New Member to the Plan</h3>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="saveMember()">

      <div class="form-group">
        <label for="memberFullName">Full Name</label>
        <input type="text" id="memberFullName" class="form-control"
               [(ngModel)]="memberFullName" name="memberFullName" required>
      </div>

      <div class="form-group">
        <label for="memberEmail">Email</label>
        <input type="email" id="memberEmail" class="form-control"
               [(ngModel)]="memberEmail" name="memberEmail" required>
      </div>

      <div class="form-group">
        <label for="memberCategory">Category</label>
        <select id="memberCategory" class="form-control"
                [(ngModel)]="memberCategory" name="memberCategory"
                (ngModelChange)="updatePreviewChart()" required>
          <option value="" disabled>Select a category...</option>
          <option value="producer">Producer</option>
          <option value="consumer">Consumer</option>
        </select>
      </div>

      <div class="form-group">
        <label for="memberEnergy">24 Energy Values (t0–t23)</label>
        <textarea id="memberEnergy" class="form-control" rows="4"
                  [(ngModel)]="memberEnergyValues" name="memberEnergyValues"
                  (ngModelChange)="updatePreviewChart()"
                  placeholder="Enter 24 values separated by commas or spaces (e.g. 1.5, 2, 3.0...)."
                  required></textarea>
        <small>Enter 24 numbers separated by commas or spaces.</small>
      </div>

      <div *ngIf="previewChartData" class="chart-preview-container">
        <h4>Profile Preview</h4>
        <app-energy-chart
          [data]="previewChartData"
          [options]="chartOptions">
        </app-energy-chart>
      </div>

      <div class="form-button-container">
        <button type="submit" class="btn">
          Save Member
        </button>
      </div>

    </form>
  </div>
</div>
