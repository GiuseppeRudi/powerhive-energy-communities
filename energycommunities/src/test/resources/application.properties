# --- Configurazione per i Test con H2 ---

# URL per un database H2 in-memory chiamato 'testdb'
# 'mem' significa che il database vive solo nella RAM e viene cancellato alla fine.
spring.datasource.url=jdbc:h2:mem:testdb

# Driver, username e password standard per H2
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Dice a Hibernate di creare lo schema del DB all'inizio dei test
# e di distruggerlo alla fine. Questo garantisce test puliti e isolati.
spring.jpa.hibernate.ddl-auto=create-drop

# Specifica a Hibernate di "parlare" il dialetto SQL di H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect