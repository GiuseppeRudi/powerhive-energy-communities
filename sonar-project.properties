# Chiave del progetto (presa dalla tua schermata)
sonar.projectKey=GiuseppeRudi_PowerHive-Energy-Communities
sonar.organization=giusepperudi

# Informazioni globali
sonar.projectName=PowerHive Energy Communities
sonar.sourceEncoding=UTF-8

# Elenco dei "moduli" (le tue due applicazioni)
sonar.modules=backend,frontend

# --- Configurazione del Modulo BACKEND (SINTASSI CORRETTA) ---
backend.sonar.projectName=Backend (Java)
backend.sonar.projectBaseDir=energycommunities
backend.sonar.sources=src/main/java
backend.sonar.tests=src/test/java
backend.sonar.java.binaries=target/classes

# --- Configurazione del Modulo FRONTEND (SINTASSI CORRETTA) ---
frontend.sonar.projectName=Frontend (Angular)
frontend.sonar.projectBaseDir=energycommunities-ng
frontend.sonar.sources=src
frontend.sonar.tests=src
frontend.sonar.test.inclusions=**/*.spec.ts
frontend.sonar.exclusions=node_modules/
frontend.sonar.typescript.lcov.reportPaths=coverage/lcov.info
